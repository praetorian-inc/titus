name: CLI Surface Drift

# Fails when the documented CLI surface drifts from the live cobra tree.
# No `paths:` filter: docs-only PRs skip ci.yml.
on:
  # No `branches:` filter: `on.pull_request.branches` matches the BASE, so
  # `branches: [main]` would skip stacked PRs.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-surface:
    name: CLI Surface Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Snapshot the committed documentation
        run: |
          set -eo pipefail
          find docs README.md -type f -exec sha256sum {} + \
            | LC_ALL=C sort > "$RUNNER_TEMP/docs.before"
          echo "baselined $(wc -l < "$RUNNER_TEMP/docs.before") file(s)"

      - name: Check CLI surface and documentation for drift
        run: |
          set -eo pipefail
          go test ./cmd/titus -run 'TestCLISurface' -count=1 -v \
            | tee "$RUNNER_TEMP/gate.log"
          for name in TestCLISurface TestCLISurfaceDocLint TestCLISurfaceGateDetectsRename; do
            if ! grep -qE "^--- PASS: ${name} " "$RUNNER_TEMP/gate.log"; then
              echo "::error::${name} did not run. The drift gate is not executing; check the -run pattern against the test names in cmd/titus/cli_surface_test.go."
              exit 1
            fi
          done

      - name: Verify the gate did not rewrite the goldens
        run: |
          set -eo pipefail
          find docs README.md -type f -exec sha256sum {} + \
            | LC_ALL=C sort > "$RUNNER_TEMP/docs.after"
          if ! diff -u "$RUNNER_TEMP/docs.before" "$RUNNER_TEMP/docs.after"; then
            echo "::error::The drift gate wrote to the committed documentation; the diff above names every file added, removed or changed. Check mode must compare without writing, so this is a defect in the gate itself -- cmd/titus/cli_surface_test.go, or a clisurface write reached outside the -update branch. Regenerating with 'make cli-docs' will not fix it."
            exit 1
          fi
