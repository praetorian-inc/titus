name: Gemini PR Assistant

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review_comment:
    types: [created]

jobs:
  gemini-review:
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name != 'pull_request_review_comment' || contains(github.event.comment.body, '@gemini'))
    uses: praetorian-inc/public-workflows/.github/workflows/gemini-code.yml@bea437fe87b9c4f67a891d7c6539e7bcdbe988e9  # v2.21.21
    permissions:
      contents: read
      pull-requests: write
      actions: read  # ENG-7654: fetch-graph downloads this repo's graphify artifact (fail-open skip if none)
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
