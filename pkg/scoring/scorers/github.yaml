# GitHub token scorer (YAML).
#
# Scorer "github-fine-grained-pat" covers np.github.7 with a static -10 delta;
# fine-grained PATs are structurally scoped at creation, so no HTTP checks are
# needed. (Dynamic repo/org checks for np.github.7 live in GitHubGoScorer,
# pkg/scoring/github.go.)
#
# Classic PATs (np.github.1) and OAuth tokens (np.github.2) are scored by the Go
# scorer "github-classic-pat-scope" (pkg/scoring/github_classic.go). Their
# X-OAuth-Scopes header is a comma-separated set that requires exact-token
# matching and negation (public_repo-only, read:user-only) — semantics the YAML
# header_contains DSL cannot express — so that logic is implemented in Go.
scorers:
  - name: github-fine-grained-pat
    rule_ids:
      - np.github.7
    modifiers:
      - name: fine-grained-pat-prefix
        priority: 100
        match_group:
          name: token
          matches: '^github_pat_'
        delta: -10
