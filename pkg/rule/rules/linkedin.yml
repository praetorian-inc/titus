rules:

- name: LinkedIn Client ID
  id: np.linkedin.1
  base_score: 20

  pattern: |
    (?x)(?i)
    linkedin
    .?
    (?: api | app | application | client | consumer | customer )?
    .?
    (?: id | identifier | key )
    .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}  (?# string terminators, whitespace, binding operators, etc )
    \b (?P<client_id>[a-z0-9]{12,14}) \b

  categories: [api, fuzzy, identifier]

  references:
  - https://docs.microsoft.com/en-us/linkedin/shared/api-guide/best-practices/secure-applications

  examples:
  # FIXME: this example should not actually match
  - 'Email IDÂ Last 5 Digits of your SSNÂ LinkedIn IDÂ Availability'
  - |
      LINKEDIN_KEY = "77yg7tx91p4lag"
      LINKEDIN_SECRET = "zt7GeN6IH911xvRj"


- name: LinkedIn Secret Key
  id: np.linkedin.2
  base_score: 40

  pattern: |
    (?x)(?i)
    linkedin
    .?
    (?: api | app | application | client | consumer | customer | secret | key )
    .?
    (?: key | oauth | sec | secret )?
    .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}  (?# string terminators, whitespace, binding operators, etc )
    \b (?P<client_secret>[a-z0-9]{16}) \b

  categories: [api, fuzzy, secret]

  references:
  - https://docs.microsoft.com/en-us/linkedin/shared/api-guide/best-practices/secure-applications

  examples:
  - |
      LINKEDIN_KEY = "77yg7tx91p4lag"
      LINKEDIN_SECRET = "zt7GeN6IH911xvRj"


- name: LinkedIn Access Token
  id: np.linkedin.3
  base_score: 35

  pattern: |
    (?x)
    (?i: linkedin | li_at )
    (?:.|[\n\r]){0,128}?
    \b (?P<access_token> AQ[A-Za-z0-9_-]{20,1000} ) \b

  categories: [api, secret, oauth_token]

  references:
  - https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow

  examples:
  - 'linkedin.access_token = "AQUvlL_DYEzvT2wz1QJiEPeLioeA"'
  - 'LINKEDIN_ACCESS_TOKEN=AQz7rQky7Dm7HHRMXX8e7Zz53yIR7URy-0lB9T3Xm1pm0bX2zdSVkKwOcaWQnzLkprYEVejWMMDTADOXC-ZprfU-wPhttU44yHpaoMqE9W4-dYh66Een99j4KyRvrDW6IRwlaqVURYve5s1YMHCdFaCak5kFBoStJ6LXnRpysAN0Fq7nBDBmdqSKK7v7n-hZtS1MyqG6e-BbMbORqfJ_iFZQoNEdtqVG8HSanYLa7UCsI6g3XZ2Rgq3BEKfoQQbagiVTHKhR1n3_42jCB2RgBcpfqGnVLD8w24PTCSnzmYAe'
  - 'Cookie: li_at=AQEDGuqiViiIfqn0lsY_wjTfgUemCpVUZ37nNz70tyOlXwWGLNfDY1vUPMIyq8zTHXoQBX9ExJBi_-AtT_M62KcE3XxvXGsfQnY2DmMjWnoL04-oObpythg5iCuzHS3mePJBqgsaJOQhLTSezobjaszNdvZ1oY6J45-NjVnvdZAIoUhosmo13dFkFiBtjugtnGqWd9qRRfnOPI8mAWr_FM5FaeVubnRzeKCeIJgAvV58i3LT-2Fl2LwGsZfrAucmKE7iSMUqKie4qktGx8PnTUWim94wq1HgXETqZkeObgYp'
