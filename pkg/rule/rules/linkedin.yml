rules:

- name: LinkedIn Client ID
  id: np.linkedin.1
  base_score: 20

  pattern: |
    (?x)(?i)
    linkedin
    .?
    (?: api | app | application | client | consumer | customer )?
    .?
    (?: id | identifier | key )
    .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}  (?# string terminators, whitespace, binding operators, etc )
    \b (?P<client_id>[a-z0-9]{12,14}) \b

  categories: [api, fuzzy, identifier]

  references:
  - https://docs.microsoft.com/en-us/linkedin/shared/api-guide/best-practices/secure-applications

  examples:
  # FIXME: this example should not actually match
  - 'Email IDÂ Last 5 Digits of your SSNÂ LinkedIn IDÂ Availability'
  - |
      LINKEDIN_KEY = "77yg7tx91p4lag"
      LINKEDIN_SECRET = "zt7GeN6IH911xvRj"


- name: LinkedIn Secret Key
  id: np.linkedin.2
  base_score: 40

  pattern: |
    (?x)(?i)
    linkedin
    .?
    (?: api | app | application | client | consumer | customer | secret | key )
    .?
    (?: key | oauth | sec | secret )?
    .{0,2} \s{0,20} .{0,2} \s{0,20} .{0,2}  (?# string terminators, whitespace, binding operators, etc )
    \b (?P<client_secret>[a-z0-9]{16}) \b

  categories: [api, fuzzy, secret]

  references:
  - https://docs.microsoft.com/en-us/linkedin/shared/api-guide/best-practices/secure-applications

  examples:
  - |
      LINKEDIN_KEY = "77yg7tx91p4lag"
      LINKEDIN_SECRET = "zt7GeN6IH911xvRj"


- name: LinkedIn Access Token
  id: np.linkedin.3
  base_score: 35

  # An "AQ" prefix on a long base64url string is not specific to LinkedIn:
  # Azure AD flow tokens, serialized XAML and protobuf blobs share it, and
  # they were >99.9% of this rule's production hits. A LinkedIn anchor
  # (the word, or the li_at session cookie) is required within 128 bytes
  # before the token. Tokens in bare OAuth responses with no LinkedIn
  # context are not detected; nothing distinguishes them from other
  # providers' tokens. Length floor matches the documented example (28).
  pattern: |
    (?x)
    (?i: linkedin | li_at )
    (?:.|[\n\r]){0,128}?
    \b (?P<access_token> AQ[A-Za-z0-9_-]{20,1000} ) \b

  categories: [api, secret, oauth_token]

  references:
  - https://learn.microsoft.com/en-us/linkedin/shared/authentication/authorization-code-flow

  examples:
  - 'linkedin.access_token = "AQUvlL_DYEzvT2wz1QJiEPeLioeA"'
  - 'LINKEDIN_ACCESS_'
  - 'Cookie: li_'
  negative_examples:
  # Azure AD flow token: same AQ prefix, no LinkedIn context.
  - '"sFT":"AQABIQEAAACXIc87f18y-7AQGsEruYRNrkK6lBHyow44JJB0wHWbouZ156TjHMZOIQO_1YpO22P3ffAISMJBbyuZuc_tAxoW7PnfmX09biPawtiG34fZthW4xKTjLggzZ2g6GmDYl-hHCBfcwQ7kuPSS8Dout8yvmtVIMnNb6W1p5nqyR8OemkPRBq0gKUmDdCnWtXaaAQ7rGl3Qmlb9TP6WHHjasBVqtAx-tBzA3jqEB8hFE6H5trX9F8sjVI2GXimr0T6qFDcUwVBQjRqatEUxioQrDCkrVDgG6dqaJlC_HhnahWukH1mq1n2Q6NlKe4LHkEukm4k89N1lz_RNqi86SjzSBVMW-gvhYlPFkaGgoi_91e3nUfDtSsRlC4q7qKnH9QBD6RJCSjmQfHuEN9BA4Y1SvPUKJufSBQiim2dfvky0n6ftZpVzwqC3u-BFi4D4o84IWPt0FqcPU20LndpW8fTHmtxvUGUYs1b904Jv8svPxHnXh765XS5i7C9QnamsZKE1WW_oAJz7BYVUIFtv0JC8H09noKgi4cX71WKAcDx04ALsHP1Vt20PcXk1IO1_hkW19O1qBZToE8FRx8RqIBhPMUBM_bjxWKSrwXP3zXKHsNWU2kf"'
  # Serialized XAML / protobuf blobs are long AQ-prefixed base64url too.
  - ''
  # Documented LinkedIn response shape, but nothing in it says LinkedIn.
  - '{"access_token":"AQUvlL_DYEzvT2wz1QJiEPeLioeA","expires_in":5184000,"scope":"r_basicprofile"}'
