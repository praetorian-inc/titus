- name: Generic Secret
  id: np.generic.15
  base_score: 50

  pattern: |
    (?x)(?i)
    \b if \b .{0,50}
    \b (?: secret | pass | password | challenge ) \b
    \s* (?: == | != | === | !== ) \s*
    " ( [^"\n]{3,60} ) "

  categories: [fuzzy, generic, secret]

  description: >
    A password was found.
    This may allow an attacker unintended privileged access to a resource.

  examples:
  - |
      if creds.Secret != "open-sesame" {
