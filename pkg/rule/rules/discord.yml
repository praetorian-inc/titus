rules:
  - name: Discord Webhook URL
    id: kingfisher.discord.1
    secret_group: webhook_token
    base_score: 40
    pattern: |
      (?xi)
      (?P<webhook_base>
        https://discord\.com/api/webhooks/
        \d{18}
      )/
      (?P<webhook_token>
        [0-9a-z_\-]{68}
      )
      \b
    pattern_requirements:
      min_digits: 2
    min_entropy: 3.5
    confidence: medium
    examples:
      - https://discord.com/api/webhooks/123456789012345678/abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdef
    categories:
      - api
      - webhook
    validation:
      type: Http
      content:
        request:
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: '{{ TOKEN }}'
  - name: Discord Bot Token
    id: kingfisher.discord.2
    base_score: 65
    # The first segment is base64 of the bot's decimal snowflake ID. Base64 of
    # ASCII digits has a rigid shape: every 4th character encodes the high bits
    # of a digit (0x30-0x39) and is always M, N or O, and the alphabet never
    # includes '-' or '_'. 17/18/19-digit IDs give 23/24/26 characters. The
    # previous (?i)[MNO][A-Z0-9_-]{20,30} form matched any dotted identifier
    # with a 6-character middle segment (package paths, qualified table names).
    pattern: |
      (?x)
      \b
      (?P<token>
        (?:[MNO][A-Za-z0-9]{3}){5,6}(?:[MNO][A-Za-z0-9]{1,2})?
        \.[A-Za-z0-9_-]{6}
        \.[A-Za-z0-9_-]{27,40}
      )
      \b
    min_entropy: 3.3
    confidence: medium
    examples:
      - 'apikey: MTA5NTYxMjM0NTY3ODkwMTIz.GhJkLm.aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789ab'
      - 'DISCORD_TOKEN=MTIzNDU2Nzg5MDEyMzQ1Njc4.Abc123.aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789'
    negative_examples:
      - 'apikey: MC0dBvKTjD0rY0cV8i37CjBf.uLHQPq.Nb1Ok1mEhe-3iTdrGOuegj29yQR'
      - 'Bracket_Steel_BR-XLSR-3.2mm_H5.6mm_ReverseMount_8812034560Bracket'
      - 'from sdk_deployment_client.models.remote_gateway_tunnel_options_inner import RemoteNetworks'
      - 'Namespace_fixture_client1.models.fixture_batch_results_response'
      - 'DROP TABLE IF EXISTS int_analytics_published.dm_ops.session_contract_daily_fact;'
      - 'Zt3pVqRa.hgTe2kW9Lpq1XMyJQKu74BvAr5xTG2LN8q27pKWSEcN3fN9ptV2gEm.QA7Hyu.rPbXngGYcLWTKv7ZK2dSo9jpBnY.MHkEYtwrPl_rSzfkpB4'
    categories:
      - api
    validation:
      type: Http
      content:
        request:
          headers:
            Authorization: Bot {{ BOTID }}
          method: GET
          response_matcher:
            - report_response: true
            - status:
                - 200
              type: StatusMatch
          url: https://discord.com/api/v8/users/@me
    depends_on_rule:
      - rule_id: "kingfisher.discord.3"
        variable: BOTID
  - name: Discord Bot ID
    id: kingfisher.discord.3
    base_score: 10
    pattern: |
      (?xi)
      (?:discord|botid|bot_id)
      (?:.|[\n\r]){0,64}?
      (
        \d{17,19}
      )
    min_entropy: 3.5
    visible: false
    confidence: medium
    examples:
      - discord = 12345678901234567
      - 'bot_id: "123456789012345678"'
    categories:
      - identifier