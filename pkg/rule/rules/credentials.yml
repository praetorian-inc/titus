rules:
  - name: Credentials in a URL
    id: kingfisher.credentials.1
    secret_group: password
    base_score: 55
    pattern: |
      (?xi)
      https?:\/\/
      (?P<username>
        [a-z0-9._~-]+
      )
      :
      (?P<password>
        [a-z0-9._~-]+
      )
      @
      (?P<host>
        [a-z0-9.-]+
      )
      (?P<path>
        \/
        [a-z0-9\/._~-]*
      )?
    # Applies to the password (secret_group): 3.0 bits needs 9+ distinct
    # characters, which rejects ordinary 8-character passwords.
    pattern_requirements:
      ignore_if_contains:
        - password
        - changeme
        - example
    min_entropy: 2.5
    confidence: medium
    categories:
      - generic
    examples:
      - https://eaRIWNkE:qyOIhJiM@j2LYY414Q5cCYD