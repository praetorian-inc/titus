rules:
  - name: Plaid Client ID (helper)
    id: kingfisher.plaid.1
    base_score: 15
    visible: false
    # "plaid" is required within 64 characters of the key. A bare client_id
    # followed by 24 hex characters is the shape of every MongoDB ObjectId, and
    # those were >99% of this rule's production hits.
    pattern: |
      (?xi)
      \b
      plaid
      (?:.|[\n\r]){0,64}?
      client[_-]?id
      \b
      (?:\s*[:=]\s*|["']\s*:\s*["']|=\s*["'])
      \s*
      \b
      (?P<client_id>
        [a-z0-9]{24}
      )
      \b
    min_entropy: 2.8
    confidence: medium
    examples:
      - 'plaid_client_id="sd479fjropblyr5b4m2dutha"'
      - 'PLAID_CLIENT_ID = 5f0c1b2d3e4f5a6b7c8d9e0f'
      - '"plaid": {"env": "production", "client_id": "5f0c1b2d3e4f5a6b7c8d9e0f"}'
    negative_examples:
      - '"distribution_id":"64b1f0c2e9a73d5b8c4e2a17","client_id":"64b1f0c2e9a73d5b8c4e2a9d"'
      - 'client_id = "a1b2c3d4e5f60718293a4b5c"'
      - '{"$oid": "61a2c3d4e5f60718293a4b5c"}, "client_id": "61a2c3d4e5f60718293a4bff"'
    references:
      - https://plaid.com/docs/api/institutions/

  # -------------------------
  - name: Plaid Secret (Production)
    id: kingfisher.plaid.2
    base_score: 90
    pattern: |
      (?xi)
      \b
      plaid
      (?:.|[\n\r]){0,32}?
      (?:SECRET|PRIVATE|ACCESS|KEY|TOKEN|ACCESS_KEY)
      (?:.|[\n\r]){0,32}?
      \b
      (?P<token>
        [a-z0-9]{30}
      )
      \b
    min_entropy: 3.2
    confidence: medium
    pattern_requirements:
      min_digits: 2
      min_lowercase: 6
      ignore_if_contains:
        - changeme
        - example
        - test
    examples:
      - 'plaid_secret_key="wuxd6sw7ma4lv10xremyhz7ulf9owc"'
    references:
      - https://plaid.com/docs/api/institutions/
      - https://plaid.com/docs/quickstart/glossary/
      - https://plaid.com/docs/errors/invalid-input/
    depends_on_rule:
      - rule_id: kingfisher.plaid.1
        variable: CLIENT_ID
    validation:
      type: Http
      content:
        request:
          method: POST
          url: https://production.plaid.com/institutions/get
          headers:
            Accept: application/json
            Content-Type: application/json
          body: |
            {
              "client_id": "{{ CLIENT_ID | json_escape }}",
              "secret": "{{ TOKEN | json_escape }}",
              "count": 1,
              "offset": 0,
              "country_codes": ["US"]
            }
          response_matcher:
            - report_response: true
            - type: StatusMatch
              status: [200]
            - type: JsonValid
            # If keys are invalid, Plaid returns INVALID_API_KEYS (HTTP 400).
            - type: WordMatch
              negative: true
              words:
                - '"INVALID_API_KEYS"'

