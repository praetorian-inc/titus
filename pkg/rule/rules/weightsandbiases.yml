rules:
  - name: Weights and Biases API Key
    id: kingfisher.wandb.1
    base_score: 55
    pattern: |
      (?xi)
      (?:wandb|weightsandbiases)
      (?:.|[\n\r]){0,16}?
      \b
      (
        [a-f0-9]{40}
      )
      \b
    pattern_requirements:
      min_digits: 2
    confidence: medium
    min_entropy: 3.5
    examples:
      - "export WANDB_API_KEY=872ab943740b34157041da2529fb160d89632710"
      - "wandb_api_key: 1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b"
      - "WeightsandBiases token => 7f9d2e34c1a0b5d6e7f81234abcd5678ef901234"
    validation:
      type: Http
      content:
        request:
          method: POST
          url: "https://api.wandb.ai/graphql"
          headers:
            Authorization: "Basic {{ 'api:' | append: TOKEN | b64enc }}"
            Content-Type: "application/json"
          body: |
            {"query":"query { viewer { email username } }"}
          response_matcher:
            - report_response: true
            - type: JsonValid
            - type: WordMatch
              words:
                - '"username"'

  - name: Weights and Biases API Key (v1)
    id: titus.wandb.1
    base_score: 55
    pattern: |
      (?xi)
      \b
      (
        wandb_v1_[A-Za-z0-9_]{40,200}
      )
      \b
    pattern_requirements:
      min_digits: 1
    confidence: high
    min_entropy: 4.0
    examples:
      - "export WANDB_API_KEY=wandb_v1_ABC123def456GHI789jkl012MNO345pqr678STU901vwx234YZa567bcd890ef0"
      - "wandb login wandb_v1_XYZ987wvu654TSR321qpo098NML765kji432HGF109edc876BAZ543yxw210vut"
    validation:
      type: Http
      content:
        request:
          method: POST
          url: "https://api.wandb.ai/graphql"
          headers:
            Authorization: "Basic {{ 'api:' | append: TOKEN | b64enc }}"
            Content-Type: "application/json"
          body: |
            {"query":"query { viewer { id } }"}
          response_matcher:
            - report_response: true
            - type: JsonValid
            - type: WordMatch
              words: ['"id"']
