---
# Synthetic, and the reason the rejection is keyed on the body rather than on 403.
# warehouse answers 403 for a token that is entirely valid when its owner has no
# two-factor authentication enabled. Calling that "invalid" would hide a live
# credential, so this must land on undetermined instead.
version: 2
interactions:
    - id: 0
      request:
        proto: HTTP/1.1
        proto_major: 1
        proto_minor: 1
        content_length: 0
        host: ""
        url: https://upload.pypi.org/legacy/
        method: POST
      response:
        proto: HTTP/2.0
        proto_major: 2
        proto_minor: 0
        content_length: 0
        body: |
            <html>
             <head>
              <title>403 User 'example', associated with the API token used, does not have two-factor authentication enabled.</title>
             </head>
             <body>
              <h1>403 User 'example', associated with the API token used, does not have two-factor authentication enabled.</h1>
              Access was denied to this resource.<br/><br/>
            User 'example', associated with the API token used, does not have two-factor authentication enabled. Please enable two-factor authentication before attempting to upload to PyPI.
             </body>
            </html>
        headers: {}
        status: 403 Forbidden
        code: 403
        duration: 0s
