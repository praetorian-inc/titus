validators:
  - name: gumroad-access-token
    rule_ids:
      - kingfisher.gumroad.1
    http:
      method: GET
      url: "https://api.gumroad.com/v2/user"
      auth:
        type: query
        secret_group: "1"
        query_param: "access_token"
      headers:
        - name: Accept
          value: application/json
      success_codes: [200]
      failure_codes: [401]
