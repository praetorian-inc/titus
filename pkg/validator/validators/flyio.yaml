# pkg/validator/validators/flyio.yaml
#
# api.fly.io/graphql is a GraphQL endpoint, so it answers 200 to an
# unauthenticated request and reports the problem in the body:
#
#   POST /graphql, bearer <freshly generated random token>
#   -> 200 {"data":null,"errors":[{"message":"You must be authenticated to
#           view this.","extensions":{"code":"UNAUTHORIZED"}}]}
#
# success_codes: [200] alone therefore reported every fly.io token as valid at
# confidence 1.0. The rejection has to come from the body.
#
# Keyed on the GraphQL error code rather than the human-readable message, since
# the code is the stable half of that contract. A successful { viewer { id } }
# response carries no errors array and so cannot contain it.
validators:

- name: flyio-api-token
  rule_ids:
    - kingfisher.flyio.1

  http:
    method: POST
    url: "https://api.fly.io/graphql"
    auth:
      type: bearer
      secret_group: "1"
    headers:
      - name: "Content-Type"
        value: "application/json"
    body: '{"query": "{ viewer { id } }"}'

    success_codes: [200]
    failure_codes: [401, 403]
    failure_body_contains: "UNAUTHORIZED"
